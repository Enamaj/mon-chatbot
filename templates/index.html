<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Duprie's Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h2>🤖 Duprie's Chatbot</h2>
    <div id="chat-box"></div>
    <div id="input-area">
        <input type="text" id="message-input" placeholder="Écris ton message...">
        <button onclick="envoyerMessage()">Envoyer</button>
    </div>

<button onclick="effacerConversation()" style="margin-top: 10px; background: #dc3545;">🗑️ Effacer la conversation</button>

    <script>
        async function envoyerMessage() {
            const input = document.getElementById("message-input");
            const message = input.value.trim();
            if (!message) return;

            afficherMessage(message, "user");
            input.value = "";

            const typingId = afficherTypingIndicator();

            const response = await fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: message })
            });

            const data = await response.json();

            retirerTypingIndicator(typingId);
            afficherMessage(data.reply, "bot");
        }

        function afficherMessage(texte, type) {
            const chatBox = document.getElementById("chat-box");
            const div = document.createElement("div");
            div.className = "message " + type;
            div.textContent = texte;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function afficherTypingIndicator() {
            const chatBox = document.getElementById("chat-box");
            const div = document.createElement("div");
            div.className = "message bot typing";
            div.id = "typing-indicator";
            div.textContent = "Duprie est en train d'écrire...";
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return div.id;
        }

        function retirerTypingIndicator(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        document.getElementById("message-input").addEventListener("keypress", function(e) {
            if (e.key === "Enter") envoyerMessage();
        });

        async function effacerConversation() {
            const confirmation = confirm("Es-tu sûr de vouloir effacer toute la conversation ?");
            if (!confirmation) return;

            await fetch("/reset", { method: "POST" });

            document.getElementById("chat-box").innerHTML = "";
        }

        async function chargerHistorique() {
            const response = await fetch("/history");
            const messages = await response.json();
            messages.forEach(msg => {
                afficherMessage(msg.content, msg.role === "user" ? "user" : "bot");
            });
        }

        chargerHistorique();
    </script>
</body>
</html>
